
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Kumar Studio V4.10.3</title>
</head>

<body style="background:#101827;color:white;font:16px Arial">

<p id="loading">
Loading Anatomical Joint Protection...
</p>

<script>
async function start(){

const response=await fetch(
'./studio-v4.10.html',
{cache:'no-cache'}
);

if(!response.ok)
throw Error('V4.10 source unavailable');

let source=await response.text();

const oldCode=
'upgrade+"'+
String.fromCharCode(92,92)+
'n"+marker';

if(!source.includes(oldCode))
throw Error('Initialization patch missing');

source=source.replace(
oldCode,
'upgrade+String.fromCharCode(10)+marker'
);

const correction=`

const damage4103={L:false,R:false};

const jointLimits4103=[
[45,60,80],
[90,110,80],
[90,110,80],
[90,110,80],
[90,110,80]
];

const damageValues4103={
L:Array.from({length:5},()=>[0,0,0]),
R:Array.from({length:5},()=>[0,0,0])
};

function anatomicalFist4103(side,amount){

if(!posed||restRig!==posed)return;

const frame=handFrame(side);

if(!frame)return;

const strength=THREE.MathUtils.clamp(
amount/100,0,1
);

const wrist=getBone('wrist.'+side);

if(!wrist)return;

const axes=new Map();

const directions=new Map();

for(let f=1;f<=5;f++){

for(let j=1;j<=3;j++){

const bone=getBone(
fingerName(side,f,j)
);

if(bone)
bone.quaternion.identity();

}

}

posed.updateMatrixWorld(true);

const wristQ=wrist.getWorldQuaternion(
new THREE.Quaternion()
);

const palm=frame.normal.clone()
.applyQuaternion(wristQ)
.normalize();

if(side==='L')
palm.negate();

const across=frame.across.clone()
.applyQuaternion(wristQ)
.normalize();

const along=frame.along.clone()
.applyQuaternion(wristQ)
.normalize();

function boneDirection(f,j){

const bone=getBone(
fingerName(side,f,j)
);

if(!bone)return null;

const next=j<3?getBone(
fingerName(side,f,j+1)
):null;

if(next)
return next.position.clone()
.normalize();

const child=bone.children.find(
c=>c.isBone&&
c.position.lengthSq()>0.000001
);

if(child)
return child.position.clone()
.normalize();

return bone.position.clone()
.normalize();

}

function calculateAxis(bone,dir,target){

const q=bone.getWorldQuaternion(
new THREE.Quaternion()
);

const d=dir.clone()
.applyQuaternion(q)
.normalize();

const axis=new THREE.Vector3()
.crossVectors(d,target);

if(axis.lengthSq()<0.000001)
return null;

return axis.normalize()
.applyQuaternion(q.clone().invert())
.normalize();

}

for(let f=2;f<=5;f++){

const first=getBone(
fingerName(side,f,1)
);

const dir=boneDirection(f,1);

if(!first||!dir)continue;

const q=first.getWorldQuaternion(
new THREE.Quaternion()
);

const worldDir=dir.clone()
.applyQuaternion(q)
.normalize();

const worldAxis=new THREE.Vector3()
.crossVectors(worldDir,palm);

if(worldAxis.lengthSq()<0.000001)
continue;

worldAxis.normalize();

for(let j=1;j<=3;j++){

const bone=getBone(
fingerName(side,f,j)
);

if(!bone)continue;

const boneQ=bone.getWorldQuaternion(
new THREE.Quaternion()
);

axes.set(
bone.name,
worldAxis.clone()
.applyQuaternion(boneQ.invert())
.normalize()
);

}

}

function rotateJoint(f,j,angle){

const bone=getBone(
fingerName(side,f,j)
);

if(!bone)return;

const axis=axes.get(bone.name);

if(!axis)return;

let value=angle;

if(damage4103[side]){

value+=damageValues4103[side]
[f-1][j-1];

}else{

value=THREE.MathUtils.clamp(
value,
0,
jointLimits4103[f-1][j-1]
);

}

bone.quaternion.setFromAxisAngle(
axis,
THREE.MathUtils.degToRad(value)
);

}

for(let f=2;f<=5;f++){

const angles=[78,100,65];

for(let j=1;j<=3;j++){

rotateJoint(
f,j,
angles[j-1]*strength
);

}

}

posed.updateMatrixWorld(true);

const t1=getBone(
fingerName(side,1,1)
);

const t2=getBone(
fingerName(side,1,2)
);

const t3=getBone(
fingerName(side,1,3)
);

if(t1&&t2&&t3){

const baseTarget=across.clone()
.negate()
.addScaledVector(along,0.65)
.addScaledVector(palm,0.35)
.normalize();

const baseAxis=calculateAxis(
t1,
boneDirection(1,1),
baseTarget
);

if(baseAxis){

axes.set(t1.name,baseAxis);

rotateJoint(1,1,40*strength);

}

posed.updateMatrixWorld(true);

const index=getBone(
fingerName(side,2,2)
);

let middleTarget=across.clone()
.negate()
.addScaledVector(palm,0.25)
.normalize();

if(index){

middleTarget=index.getWorldPosition(
new THREE.Vector3()
).sub(
t2.getWorldPosition(
new THREE.Vector3()
)
).normalize();

}

const middleAxis=calculateAxis(
t2,
boneDirection(1,2),
middleTarget
);

if(middleAxis){

axes.set(t2.name,middleAxis);

const worldThumbAxis=middleAxis.clone()
.applyQuaternion(
t2.getWorldQuaternion(
new THREE.Quaternion()
)
);

const tipAxis=worldThumbAxis
.applyQuaternion(
t3.getWorldQuaternion(
new THREE.Quaternion()
).invert()
).normalize();

axes.set(t3.name,tipAxis);

rotateJoint(1,2,35*strength);

rotateJoint(1,3,30*strength);

}

}

posed.updateMatrixWorld(true);

syncJoint();

}

const previousHand4103=applyHand;

applyHand=function(side){

if(!posed||restRig!==posed)return;

const state=handState[side];

if(state.mode==='fist'){

anatomicalFist4103(
side,
Math.max(...state.curl)
);

return;

}

previousHand4103(side);

};

const previousPunch4103=punch410;

punch410=function(progress){

previousPunch4103(progress);

if(!posed||!snapshot410)return;

const strength=Math.min(
100,
Math.max(
0,
Math.sin(Math.PI*progress)*220
)
);

anatomicalFist4103(
side410.value,
strength
);

};

const protectionPanel4103=
ui410("details");

protectionPanel4103.open=true;

protectionPanel4103.innerHTML=
"<summary>Anatomical Hand Protection</summary>";

ui410(
"p",
"Normal Mode: protected fist bending",
protectionPanel4103
);

for(const side of ["L","R"]){

const label=side==="L"?
"Left Hand":"Right Hand";

ui410(
"h3",label,
protectionPanel4103
);

const test=ui410(
"button",
"Test "+label+" Closed Fist",
protectionPanel4103
);

test.onclick=()=>{

stop410();

if(!posed)return;

if(restRig!==posed)
captureAnatomy();

handState[side].mode="fist";

handState[side].curl=
[85,100,100,100,100];

handState[side].opposition=100;

showHandValues(side);

anatomicalFist4103(side,100);

};

const damageLabel=ui410(
"label",
" Enable Injury Mode",
protectionPanel4103
);

const toggle=document.createElement(
"input"
);

toggle.type="checkbox";

damageLabel.prepend(toggle);

const editor=ui410(
"div","",
protectionPanel4103
);

editor.style.display="none";

toggle.onchange=()=>{

damage4103[side]=toggle.checked;

editor.style.display=
toggle.checked?"block":"none";

if(!toggle.checked){

for(const row of damageValues4103[side])
row.fill(0);

}

if(posed)
anatomicalFist4103(side,100);

};

for(let f=1;f<=5;f++){

ui410(
"h4",
handNames[f-1],
editor
);

for(let j=1;j<=3;j++){

const title=ui410(
"label",
"Joint "+j+" : 0 degrees",
editor
);

const input=ui410(
"input","",editor
);

input.type="range";
input.min=-180;
input.max=180;
input.step=1;
input.value=0;
input.style.width="100%";

input.oninput=()=>{

if(!damage4103[side])return;

const value=Number(input.value);

damageValues4103[side]
[f-1][j-1]=value;

title.textContent=
"Joint "+j+" : "+value+" degrees";

anatomicalFist4103(side,100);

};

}

}

const restore=ui410(
"button",
"Restore Healthy Hand",
protectionPanel4103
);

restore.onclick=()=>{

damage4103[side]=false;

toggle.checked=false;

editor.style.display="none";

for(const row of damageValues4103[side])
row.fill(0);

for(const input of editor.querySelectorAll("input"))
input.value=0;

setGesture(side,"Open Hand");

};

}

document.title=
"Kumar Studio V4.10.3";

const heading4103=
document.querySelector("h1");

if(heading4103)
heading4103.textContent=
"KUMAR STUDIO V4.10.3";

`;

const marker=
'const marker="renderer.setAnimationLoop(()=>{";';

if(!source.includes(marker))
throw Error('Animation marker missing');

const insertion=
'const correction4103='+
JSON.stringify(correction)+';';

source=source.replace(
marker,
()=>insertion+
String.fromCharCode(10)+marker
);

const patchPoint=
'upgrade+String.fromCharCode(10)+marker';

if(!source.includes(patchPoint))
throw Error('Upgrade insertion missing');

source=source.replace(
patchPoint,
'upgrade+String.fromCharCode(10)+'+
'correction4103+'+
'String.fromCharCode(10)+marker'
);

document.open();
document.write(source);
document.close();

}

start().catch(e=>{

const status=
document.getElementById('loading');

if(status)
status.textContent='Error: '+e.message;

});

</script>
</body>
</html>
