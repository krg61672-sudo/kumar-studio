<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kumar Studio V4.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:Arial}
header{padding:15px;background:#191e2c;color:#e8c477;font-size:22px;font-weight:bold}
main{display:flex;height:calc(100dvh - 56px)}
#panel{width:260px;overflow:auto;background:#191e2c;padding:14px}
#view{flex:1;min-width:0}
h3{color:#e8c477;font-size:15px}
button,select,input{width:100%;margin:6px 0}
button,select{background:#30394d;color:white;border:1px solid #596278;padding:10px;border-radius:6px}
label{font-size:12px}
canvas{display:block}
#status{font-size:12px;color:#e8c477}
section{border-bottom:1px solid #465065;padding-bottom:12px}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>KUMAR STUDIO V4.2</header>
<main>
<div id="panel">
<section>
<h3>HUMAN CREATOR</h3>
<button id="auto">Load Human Model</button>
<input type="file" id="file" accept=".obj">
<p id="status">Loading...</p>
<h3>BODY PRESET</h3>
<select id="preset">
<option>Normal</option>
<option>Slim</option>
<option>Athletic</option>
<option>Muscular</option>
<option>Heavy</option>
</select>
</section>
<section>
<h3>BODY PROPORTIONS</h3>
<div id="bodyControls"></div>
<label>Skin Colour</label>
<input id="skin" type="color" value="#c69b80">
</section>
<section>
<h3>FACE CREATOR</h3>
<div id="faceControls"></div>
</section>
<section>
<h3>CAMERA</h3>
<button id="front">Front View</button>
<button id="back">Back View</button>
<button id="side">Side View</button>
<button id="face">Face Close-up</button>
<button id="body">Body Close-up</button>
<button id="grid">Show / Hide Grid</button>
<button id="reset">Reset Character</button>
</section>
<section>
<h3>PROJECT</h3>
<button id="save">Save Character Settings</button>
<button id="load">Load Character Settings</button>
<button id="export">Export OBJ</button>
</section>
</div>
<div id="view"></div>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {OBJExporter} from 'three/addons/exporters/OBJExporter.js';

const $=id=>document.getElementById(id);
const view=$('view');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10131c);

const camera=new THREE.PerspectiveCamera(38,1,0.01,100);
camera.position.set(0,1,3.4);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
view.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.9,0);
controls.enableDamping=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x555566,1.5));

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(3,5,4);
scene.add(light);

const rim=new THREE.DirectionalLight(0x99bbff,1.5);
rim.position.set(-3,3,-4);
scene.add(rim);

const grid=new THREE.GridHelper(10,20);
scene.add(grid);

const actor=new THREE.Group();
scene.add(actor);

const material=new THREE.MeshStandardMaterial({
color:0xc69b80,
roughness:0.7,
side:THREE.DoubleSide
});

const bodyParts=[
['height','Height'],
['width','Overall Width'],
['depth','Body Depth'],
['shoulders','Shoulder Width'],
['chest','Chest Size'],
['waist','Waist Size'],
['hips','Hip Width'],
['biceps','Biceps Size'],
['forearms','Forearm Size'],
['thighs','Thigh Size'],
['calves','Calf Size'],
['neck','Neck Thickness']
];

const faceParts=[
['head','Head Size'],
['jaw','Jaw Width'],
['cheek','Cheek Width'],
['faceDepth','Face Depth']
];

const values={};
const allParts=[...bodyParts,...faceParts];

function makeControls(parts,container){
for(const [id,name] of parts){
values[id]=0;
const label=document.createElement('label');
label.textContent=name;
const number=document.createElement('span');
number.style.float='right';
number.textContent='0';
number.id=id+'Value';
label.appendChild(number);
const input=document.createElement('input');
input.type='range';
input.min=-50;
input.max=50;
input.value=0;
input.id=id;
input.oninput=()=>{
values[id]=Number(input.value);
number.textContent=input.value;
deform();
};
$(container).append(label,input);
}
}

makeControls(bodyParts,'bodyControls');
makeControls(faceParts,'faceControls');

let model;
let meshes=[];

function parseHuman(source){
let group='';
let bodyFound=false;

const filtered=source.split(/\r?\n/).filter(line=>{
const t=line.trim();
if(t.startsWith('g ')){
group=t.slice(2).trim();
if(group==='body')bodyFound=true;
}
if(t.startsWith('f '))return group==='body';
return true;
});

if(!bodyFound)throw new Error('MakeHuman body group missing');

const next=new OBJLoader().parse(filtered.join('\n'));
const box=new THREE.Box3().setFromObject(next);
const size=box.getSize(new THREE.Vector3());
const center=box.getCenter(new THREE.Vector3());

if(!Number.isFinite(size.y)||size.y<=0)
throw new Error('Invalid mesh');

const scale=1.8/size.y;

if(model){
actor.remove(model);
model.traverse(o=>{
if(o.isMesh)o.geometry.dispose();
});
}

meshes=[];
next.traverse(o=>{
if(!o.isMesh)return;
o.material=material;
const p=o.geometry.attributes.position;

for(let i=0;i<p.count;i++){
p.setXYZ(i,
(p.getX(i)-center.x)*scale,
(p.getY(i)-box.min.y)*scale,
(p.getZ(i)-center.z)*scale
);
}
p.needsUpdate=true;
o.geometry.computeVertexNormals();
o.geometry.computeBoundingSphere();

meshes.push({
mesh:o,
original:new Float32Array(p.array)
});
});

model=next;
actor.add(model);
deform();
$('status').textContent='Human mesh ready';
}

async function loadRemote(){
$('status').textContent='Downloading human mesh...';
try{
const url='https://raw.githubusercontent.com/makehumancommunity/makehuman/master/makehuman/data/3dobjs/base.obj';
const response=await fetch(url);
if(!response.ok)throw new Error('Download failed');
parseHuman(await response.text());
}catch(e){
$('status').textContent='Use Choose File: '+e.message;
}
}

$('auto').onclick=loadRemote;

$('file').onchange=async e=>{
if(!e.target.files[0])return;
try{
parseHuman(await e.target.files[0].text());
}catch(err){
$('status').textContent=err.message;
}
};

function bell(v,c,w){
return Math.exp(-Math.pow((v-c)/w,2));
}

function smooth(a,b,x){
let t=Math.max(0,Math.min(1,(x-a)/(b-a)));
return t*t*(3-2*t);
}

function val(id){
return values[id]/100;
}

function deform(){
if(!model)return;

for(const item of meshes){
const p=item.mesh.geometry.attributes.position;
const original=item.original;

for(let i=0;i<p.count;i++){
let x=original[i*3];
let y=original[i*3+1];
let z=original[i*3+2];

const ax=Math.abs(x);
const h=y/1.8;
const torso=1-smooth(0.20,0.34,ax);
const arm=smooth(0.23,0.40,ax)*bell(h,0.68,0.18);
const leg=1-smooth(0.47,0.56,h);

let sx=1;
let sz=1;

sx+=val('shoulders')*bell(h,0.79,0.08)*0.7;
sx+=val('chest')*bell(h,0.73,0.08)*torso*0.7;
sz+=val('chest')*bell(h,0.73,0.08)*torso;
sx+=val('waist')*bell(h,0.60,0.07)*torso;
sz+=val('waist')*bell(h,0.60,0.07)*torso*0.7;
sx+=val('hips')*bell(h,0.50,0.07)*torso;
sz+=val('hips')*bell(h,0.50,0.07)*torso*0.7;

sx+=val('biceps')*arm*bell(ax,0.36,0.13)*0.35;
sz+=val('biceps')*arm*bell(ax,0.36,0.13);
sz+=val('forearms')*arm*bell(ax,0.55,0.12);

sx+=val('thighs')*leg*bell(h,0.38,0.10)*0.55;
sz+=val('thighs')*leg*bell(h,0.38,0.10);
sx+=val('calves')*leg*bell(h,0.18,0.08)*0.55;
sz+=val('calves')*leg*bell(h,0.18,0.08);

sx+=val('neck')*bell(h,0.85,0.035)*torso;
sz+=val('neck')*bell(h,0.85,0.035)*torso;

const head=smooth(0.86,0.92,h);

sx+=val('head')*head*0.6;
sz+=val('head')*head*0.6;
sx+=val('jaw')*bell(h,0.91,0.025)*0.6;
sx+=val('cheek')*bell(h,0.95,0.025)*0.6;
sz+=val('faceDepth')*head*0.6;

x*=sx;
z*=sz;

x*=1+val('width')*0.5;
z*=1+val('depth')*0.5;
y*=1+val('height')*0.4;

p.setXYZ(i,x,y,z);
}

p.needsUpdate=true;
item.mesh.geometry.computeVertexNormals();
item.mesh.geometry.computeBoundingSphere();
}
}

function setValue(id,v){
values[id]=v;
$(id).value=v;
$(id+'Value').textContent=v;
}

function resetValues(){
for(const [id] of allParts)setValue(id,0);
}

$('preset').onchange=e=>{
resetValues();
const presets={
Normal:{},
Slim:{width:-20,waist:-20,chest:-10,thighs:-15},
Athletic:{shoulders:20,chest:15,biceps:15,waist:-10},
Muscular:{shoulders:35,chest:35,biceps:40,forearms:25,thighs:30,calves:25,neck:20},
Heavy:{width:25,depth:25,waist:40,hips:25,thighs:25}
};
for(const [id,v] of Object.entries(presets[e.target.value]))
setValue(id,v);
deform();
};

$('skin').oninput=e=>material.color.set(e.target.value);

function setView(x,y,z,target){
camera.position.set(x,y,z);
controls.target.set(0,target,0);
controls.update();
}

$('front').onclick=()=>setView(0,0.9,3.4,0.9);
$('back').onclick=()=>setView(0,0.9,-3.4,0.9);
$('side').onclick=()=>setView(3.4,0.9,0,0.9);
$('face').onclick=()=>{
const h=1+val('height')*0.4;
setView(0,1.65*h,0.65,1.65*h);
};
$('body').onclick=()=>setView(0,1.2,1.8,1.2);
$('grid').onclick=()=>grid.visible=!grid.visible;

$('reset').onclick=()=>{
resetValues();
$('preset').value='Normal';
$('skin').value='#c69b80';
material.color.set('#c69b80');
deform();
setView(0,0.9,3.4,0.9);
};

$('save').onclick=()=>{
localStorage.setItem('kumar42',JSON.stringify({
values,skin:$('skin').value
}));
$('status').textContent='Settings saved';
};

$('load').onclick=()=>{
try{
const raw=localStorage.getItem('kumar42');
if(!raw)throw new Error('No saved settings');
const data=JSON.parse(raw);
for(const [id] of allParts)
setValue(id,Number(data.values[id])||0);
$('skin').value=data.skin;
material.color.set(data.skin);
deform();
$('status').textContent='Settings loaded';
}catch(e){
$('status').textContent=e.message;
}
};

$('export').onclick=()=>{
if(!model)return;
actor.updateMatrixWorld(true);
const result=new OBJExporter().parse(actor);
const blob=new Blob([result],{type:'text/plain'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='KumarCharacter.obj';
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};

function resize(){
const w=view.clientWidth;
const h=view.clientHeight;
renderer.setSize(w,h);
camera.aspect=w/Math.max(h,1);
camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();
loadRemote();
</script>
</body>
</html>
