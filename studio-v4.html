<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumar Studio V4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:Arial}
header{padding:15px;background:#191e2c;color:#e8c477;font-size:22px;font-weight:bold}
main{display:flex;height:calc(100dvh - 60px)}
#panel{width:245px;overflow:auto;background:#191e2c;padding:12px}
#view{flex:1;min-width:0;position:relative}
h3{color:#e8c477;font-size:15px}
button,select,input{width:100%;margin:5px 0}
button,select{background:#30394d;color:white;border:1px solid #4a5366;padding:10px;border-radius:6px}
label{font-size:12px;color:#bfc8d8}
section{border-bottom:1px solid #394152;padding-bottom:10px}
canvas{display:block}
#status{font-size:12px;color:#bfc8d8}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>KUMAR STUDIO V4</header>
<main>
<div id="panel">

<section>
<h3>CHARACTER STUDIO</h3>
<input type="file" id="file" accept=".glb">
<label>Character Height</label>
<input id="height" type="range" min="0.7" max="1.5" step="0.01" value="1">
<button id="left">Rotate Left</button>
<button id="right">Rotate Right</button>
<button id="reset">Reset Camera</button>
<div id="status">Loading character...</div>
</section>

<section>
<h3>ANIMATION STUDIO</h3>
<button data-anim="idle">Idle</button>
<button data-anim="walk">Walk</button>
<button data-anim="run">Run</button>
<label>Animation Speed</label>
<input id="speed" type="range" min="0" max="2" step="0.1" value="1">
</section>

<section>
<h3>WEAPON STUDIO</h3>
<button id="sword">Show / Hide Sword</button>
<label>Weapon Colour</label>
<input id="weaponColor" type="color" value="#e8c477">
<label>Weapon Size</label>
<input id="weaponSize" type="range" min="0.5" max="2" step="0.1" value="1">
</section>

<section>
<h3>WING STUDIO</h3>
<button id="wings">Show / Hide Wings</button>
<label>Wing Colour</label>
<input id="wingColor" type="color" value="#e8b84c">
<label>Wing Size</label>
<input id="wingSize" type="range" min="0.5" max="2" step="0.1" value="1">
</section>

<section>
<h3>DIVINE HALO</h3>
<button id="halo">Summon / Hide Halo</button>
<input id="haloColor" type="color" value="#ffcc44">
<label>Rotation Speed</label>
<input id="haloSpeed" type="range" min="0" max="3" step="0.1" value="1">
</section>

<section>
<h3>DOU QI STUDIO</h3>
<button id="aura">Activate / Hide Qi</button>
<select id="preset">
<option value="#ffcc44">Golden Emperor</option>
<option value="#8a32ff">Purple Thunder</option>
<option value="#ff2424">Crimson Flame</option>
<option value="#40ccff">Ice Blue</option>
<option value="#24ff88">Emerald Spirit</option>
<option value="#493080">Dark Sovereign</option>
<option value="#ffffff">Celestial White</option>
</select>
<label>Custom Qi Colour</label>
<input id="qiColor" type="color" value="#ffcc44">
<label>Qi Intensity</label>
<input id="intensity" type="range" min="0" max="5" step="0.1" value="2">
<label>Aura Size</label>
<input id="auraSize" type="range" min="0.5" max="2" step="0.1" value="1">
</section>

<section>
<h3>VOICE STUDIO</h3>
<input id="audioFile" type="file" accept="audio/*">
<button id="playAudio">Play Dialogue</button>
<button id="stopAudio">Stop Dialogue</button>
</section>

<section>
<h3>PROJECT</h3>
<button id="save">Save Settings</button>
<button id="load">Load Settings</button>
</section>

</div>
<div id="view"></div>
</main>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);
const view=$('view');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10131c);

const camera=new THREE.PerspectiveCamera(40,1,0.01,100);
camera.position.set(3,2,5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
view.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1,0);
controls.enableDamping=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x444466,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(3,6,4);
scene.add(sun);
scene.add(new THREE.GridHelper(20,40));

const actor=new THREE.Group();
scene.add(actor);

let model,mixer,clips=[],action;
const loader=new GLTFLoader();

function loadModel(url,local=false){
$('status').textContent='Loading...';
loader.load(url,g=>{
if(mixer)mixer.stopAllAction();
if(model)actor.remove(model);
model=g.scene;
actor.add(model);

model.updateMatrixWorld(true);
let box=new THREE.Box3().setFromObject(model);
let size=box.getSize(new THREE.Vector3());
let center=box.getCenter(new THREE.Vector3());
let s=1.8/Math.max(size.y,0.01);
model.scale.multiplyScalar(s);
model.position.sub(center.multiplyScalar(s));
model.position.y+=size.y*s/2;

mixer=new THREE.AnimationMixer(model);
clips=g.animations;
action=null;
play('idle');
$('status').textContent='Character ready';
if(local)URL.revokeObjectURL(url);
},undefined,()=>{
$('status').textContent='Model failed. Import a GLB.';
if(local)URL.revokeObjectURL(url);
});
}

function play(name){
if(!mixer)return;
const clip=clips.find(c=>c.name.toLowerCase().includes(name));
if(!clip){
$('status').textContent='Animation unavailable: '+name;
return;
}
if(action)action.stop();
action=mixer.clipAction(clip);
action.reset().play();
$('status').textContent='Playing '+name;
}

loadModel('https://threejs.org/examples/models/gltf/Soldier.glb');

$('file').onchange=e=>{
if(e.target.files[0])
loadModel(URL.createObjectURL(e.target.files[0]),true);
};

document.querySelectorAll('[data-anim]').forEach(b=>{
b.onclick=()=>play(b.dataset.anim);
});

$('height').oninput=e=>actor.scale.setScalar(+e.target.value);
$('left').onclick=()=>actor.rotation.y-=0.3;
$('right').onclick=()=>actor.rotation.y+=0.3;
$('reset').onclick=()=>{
camera.position.set(3,2,5);
controls.target.set(0,1,0);
controls.update();
};

const sword=new THREE.Group();
const weaponMat=new THREE.MeshStandardMaterial({
color:0xe8c477,metalness:0.8,roughness:0.25
});

const blade=new THREE.Mesh(
new THREE.BoxGeometry(0.07,0.85,0.025),weaponMat);
blade.position.y=0.5;
sword.add(blade);

const guard=new THREE.Mesh(
new THREE.BoxGeometry(0.25,0.04,0.06),weaponMat);
sword.add(guard);

const handle=new THREE.Mesh(
new THREE.CylinderGeometry(0.035,0.035,0.2,12),
new THREE.MeshStandardMaterial({color:0x222222}));
handle.position.y=-0.12;
sword.add(handle);
sword.position.set(0.55,0.8,0.1);
sword.rotation.z=-0.35;
actor.add(sword);
sword.visible=false;

$('sword').onclick=()=>sword.visible=!sword.visible;
$('weaponColor').oninput=e=>weaponMat.color.set(e.target.value);
$('weaponSize').oninput=e=>sword.scale.setScalar(+e.target.value);

const wings=new THREE.Group();
const wingMat=new THREE.MeshStandardMaterial({
color:0xe8b84c,metalness:0.4,roughness:0.3,
emissive:0x553300,side:THREE.DoubleSide
});

const wingSides=[];
for(const side of [-1,1]){
const group=new THREE.Group();
group.position.set(side*0.15,1.3,-0.2);
for(let i=0;i<12;i++){
const shape=new THREE.Shape();
shape.moveTo(0,0);
shape.quadraticCurveTo(0.16,0.5,0,1.15);
shape.quadraticCurveTo(-0.16,0.5,0,0);
const feather=new THREE.Mesh(
new THREE.ShapeGeometry(shape),wingMat);
feather.rotation.z=-side*(0.35+i*0.13);
feather.position.x=side*i*0.025;
feather.scale.y=1-i*0.035;
group.add(feather);
}
wings.add(group);
wingSides.push(group);
}
actor.add(wings);
wings.visible=false;

$('wings').onclick=()=>wings.visible=!wings.visible;
$('wingColor').oninput=e=>wingMat.color.set(e.target.value);
$('wingSize').oninput=e=>wings.scale.setScalar(+e.target.value);

const halo=new THREE.Group();
const haloMat=new THREE.MeshBasicMaterial({color:0xffcc44});

for(let i=0;i<3;i++){
const ring=new THREE.Mesh(
new THREE.TorusGeometry(0.65+i*0.13,0.012,8,100),
haloMat);
halo.add(ring);
}
for(let i=0;i<12;i++){
const gem=new THREE.Mesh(
new THREE.OctahedronGeometry(0.055),haloMat);
let a=i*Math.PI/6;
gem.position.set(Math.cos(a)*0.91,Math.sin(a)*0.91,0);
halo.add(gem);
}
halo.position.set(0,1.35,-0.45);
actor.add(halo);
halo.visible=false;

$('halo').onclick=()=>halo.visible=!halo.visible;
$('haloColor').oninput=e=>haloMat.color.set(e.target.value);

const count=500;
const pos=new Float32Array(count*3);
const seeds=[];
for(let i=0;i<count;i++){
seeds.push({
a:Math.random()*Math.PI*2,
r:0.35+Math.random()*0.65,
y:Math.random()*2
});
}

const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));

const qiMat=new THREE.PointsMaterial({
color:0xffcc44,size:0.045,
transparent:true,opacity:0.8,
blending:THREE.AdditiveBlending,
depthWrite:false
});

const aura=new THREE.Points(geo,qiMat);
aura.frustumCulled=false;
actor.add(aura);
aura.visible=false;

const qiLight=new THREE.PointLight(0xffcc44,0,4);
qiLight.position.y=1;
actor.add(qiLight);

$('aura').onclick=()=>aura.visible=!aura.visible;

function setQi(c){
qiMat.color.set(c);
qiLight.color.set(c);
$('qiColor').value=c;
}
$('preset').onchange=e=>setQi(e.target.value);
$('qiColor').oninput=e=>setQi(e.target.value);
$('auraSize').oninput=e=>aura.scale.setScalar(+e.target.value);

const audio=new Audio();
let audioURL;
$('audioFile').onchange=e=>{
if(!e.target.files[0])return;
audio.pause();
if(audioURL)URL.revokeObjectURL(audioURL);
audioURL=URL.createObjectURL(e.target.files[0]);
audio.src=audioURL;
};
$('playAudio').onclick=()=>{
if(audio.src)audio.play().catch(()=>{});
};
$('stopAudio').onclick=()=>{
audio.pause();
audio.currentTime=0;
};

$('save').onclick=()=>{
const settings={};
document.querySelectorAll('input[type=range],input[type=color],select').forEach(e=>{
settings[e.id]=e.value;
});
settings.effects=[sword.visible,wings.visible,halo.visible,aura.visible];
settings.rotation=actor.rotation.y;
localStorage.setItem('kumarV4',JSON.stringify(settings));
$('status').textContent='Settings saved';
};

$('load').onclick=()=>{
const raw=localStorage.getItem('kumarV4');
if(!raw)return;
const s=JSON.parse(raw);
for(const [id,value] of Object.entries(s)){
const e=$(id);
if(e){
e.value=value;
e.dispatchEvent(new Event('input'));
}
}
if(s.effects){
[sword.visible,wings.visible,halo.visible,aura.visible]=s.effects;
}
actor.rotation.y=s.rotation||0;
$('status').textContent='Settings loaded';
};

function resize(){
let w=view.clientWidth,h=view.clientHeight;
renderer.setSize(w,h);
camera.aspect=w/Math.max(h,1);
camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

const clock=new THREE.Clock();
let time=0;

function animate(){
requestAnimationFrame(animate);
let dt=Math.min(clock.getDelta(),0.05);
time+=dt;

if(mixer)mixer.update(dt*(+$('speed').value));

halo.rotation.z+=dt*(+$('haloSpeed').value);
wingSides.forEach((g,i)=>{
g.rotation.y=Math.sin(time*2)*0.25*(i===0?-1:1);
});

for(let i=0;i<count;i++){
let s=seeds[i];
let a=s.a+time*1.6;
pos[i*3]=Math.cos(a)*s.r;
pos[i*3+1]=(s.y+time*0.6)%2.2;
pos[i*3+2]=Math.sin(a)*s.r;
}
geo.attributes.position.needsUpdate=true;

qiLight.intensity=aura.visible?+$('intensity').value:0;
qiMat.opacity=Math.min(1,+$('intensity').value/3);

controls.update();
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
