
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Kumar Studio V4.9.3 Fix</title>
</head>

<body style="background:#101827;color:white;font:16px Arial">

<p id="loading">
Loading corrected Hand Studio...
</p>

<script>
async function start(){

const response=await fetch(
'./studio-v4.9.3.html',
{cache:'no-cache'}
);

if(!response.ok)
throw Error('V4.9.3 unavailable');

let source=await response.text();

const marker=
"replaceExact(\n'function resetSliders(){',";

const begin=source.indexOf(marker);

const end=source.indexOf(
'\n);',begin
);

if(begin<0||end<0)
throw Error('Reset patch not found');

const correction=`
replaceExact(
'handState[side].curl=[0,0,0,0,0];',
'handState[side].mode="normal";'+
'clearJointAdjust(side);'+
'handState[side].curl=[0,0,0,0,0];'
);
`;

source=
source.slice(0,begin)+
correction+
source.slice(end+3);

document.open();
document.write(source);
document.close();

}

start().catch(e=>{

document.getElementById('loading')
.textContent='Error: '+e.message;

});
</script>
</body>
</html>
