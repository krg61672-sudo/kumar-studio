
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Kumar Studio V4.9</title>
</head>

<body style="background:#101827;color:white;font:16px Arial">

<p id="loading">Loading Kumar Studio V4.9...</p>

<script>
async function start(){

async function read(file){
const r=await fetch(file,{cache:'no-cache'});
if(!r.ok)throw Error(file+' unavailable');
return await r.text();
}

let [html,v6,v8]=await Promise.all([
read('./studio-v4.5.html'),
read('./studio-v4.6.html'),
read('./studio-v4.8.html')
]);

function extract(source,name){

const marker='const '+name+'=`';
const a=source.indexOf(marker);

if(a<0)throw Error(name+' missing');

const b=source.indexOf('`;',a+marker.length);

if(b<0)throw Error(name+' incomplete');

return source.slice(a+marker.length,b);
}

const panel=extract(v6,'panel');
let rig=extract(v6,'rigCode');
const official=extract(v8,'officialRig');

const begin=rig.indexOf('function createRig(){');
const end=rig.indexOf('function selectedBone(){');

if(begin<0||end<0)
throw Error('Rig structure mismatch');

rig=rig.slice(0,begin)+official+rig.slice(end);

const a=rig.indexOf("$('buildRig').onclick=()=>{");
const b=rig.indexOf("$('joint').onchange=syncJoint;",a);

if(a<0||b<0)
throw Error('Rig handler missing');

rig=rig.slice(0,a)+`
$('buildRig').onclick=async()=>{
if(rigBusy)return;
rigBusy=true;

try{
rigStatus('Loading official anatomical rig...');
await prepareOfficialRig();
createRig();
}catch(e){
clearRig();
rigStatus(e.message);
}finally{
rigBusy=false;
}
};
`+rig.slice(b);

rig=rig.replace(
'if(!posed)createRig();',
'if(!posed){await prepareOfficialRig();createRig();}'
);

rig=rig.replaceAll(
String.fromCharCode(92,92,110),
String.fromCharCode(92,110)
);

const anatomy=`

const anatomyPanel=document.createElement('details');

anatomyPanel.open=true;

anatomyPanel.innerHTML=
'<summary>ANATOMICAL JOINT STUDIO</summary>';

$('buildRig').closest('details')
.insertAdjacentElement('afterend',anatomyPanel);

const anatomyStatus=document.createElement('p');

anatomyStatus.textContent='Build skeleton first';

anatomyPanel.appendChild(anatomyStatus);

let restRig=null;

const rest=new Map();

const anatomySliders=[];

function getBone(name){
return bones.find(b=>b.name===name);
}

function captureAnatomy(){

rest.clear();

if(!posed)return;

posed.updateMatrixWorld(true);

for(const b of bones){

rest.set(
b.name,
b.getWorldPosition(new THREE.Vector3())
);

}

restRig=posed;
}

function direction(a,b){

if(!rest.has(a)||!rest.has(b))return null;

return rest.get(b).clone()
.sub(rest.get(a)).normalize();
}

function forward(){

const d=direction('foot.L','toe2-1.L');

if(d){

d.y=0;

if(d.lengthSq()>0.000001)
return d.normalize();

}

return new THREE.Vector3(0,0,1);
}

function bend(name,next,value,target){

const bone=getBone(name);

const dir=direction(name,next);

if(!bone||!dir)return;

const axis=new THREE.Vector3()
.crossVectors(dir,target);

if(axis.lengthSq()<0.000001)return;

bone.quaternion.setFromAxisAngle(
axis.normalize(),
THREE.MathUtils.degToRad(value)
);
}

function addControl(label,min,max,action){

const title=document.createElement('label');

const value=document.createElement('span');

title.textContent=label+' ';

value.textContent='0°';

title.appendChild(value);

const slider=document.createElement('input');

slider.type='range';
slider.min=min;
slider.max=max;
slider.step=1;
slider.value=0;

slider.oninput=()=>{

if(!posed||restRig!==posed){

slider.value=0;

anatomyStatus.textContent=
'Build Character Skeleton first';

return;
}

const angle=Number(slider.value);

action(angle);

value.textContent=angle+'°';

syncJoint();

anatomyStatus.textContent=
'Anatomical controls active';

};

anatomyPanel.appendChild(title);

anatomyPanel.appendChild(slider);

anatomySliders.push({slider,value});

}

const fingerValues={L:0,R:0};

const reverseCurl={L:true,R:true};

function applyFingerCurl(side,v){

fingerValues[side]=v;

const target=forward();

if(reverseCurl[side])target.negate();

for(let f=2;f<=5;f++){

for(let j=1;j<=3;j++){

const name='finger'+f+'-'+j+'.'+side;

const bone=getBone(name);

const dir=direction(
'finger'+f+'-'+Math.min(j,2)+'.'+side,
'finger'+f+'-'+Math.min(j+1,3)+'.'+side
);

if(!bone||!dir)continue;

const axis=new THREE.Vector3()
.crossVectors(dir,target);

if(axis.lengthSq()<0.000001)continue;

const factor=j===1?1:j===2?0.85:0.65;

bone.quaternion.setFromAxisAngle(
axis.normalize(),
THREE.MathUtils.degToRad(v*factor)
);

}

}

}

for(const side of ['L','R']){

const label=side==='L'?'Left':'Right';

const heading=document.createElement('h3');

heading.textContent=label+' Side';

anatomyPanel.appendChild(heading);

addControl(label+' Shoulder Lift',0,120,v=>{

bend(
'upperarm01.'+side,
'lowerarm01.'+side,
v,new THREE.Vector3(0,1,0)
);

});

addControl(label+' Elbow Bend',0,145,v=>{

bend(
'lowerarm01.'+side,
'wrist.'+side,
v,forward()
);

});

addControl(label+' Knee Bend',0,135,v=>{

bend(
'lowerleg01.'+side,
'foot.'+side,
v,forward().negate()
);

});

addControl(label+' Forearm Twist',-85,85,v=>{

const bone=getBone('lowerarm02.'+side);

const axis=direction(
'lowerarm02.'+side,'wrist.'+side
);

if(bone&&axis){

bone.quaternion.setFromAxisAngle(
axis,
THREE.MathUtils.degToRad(v)
);

}

});

addControl(label+' Finger Curl',0,90,v=>{

applyFingerCurl(side,v);

});

const reverse=document.createElement('button');

reverse.textContent=label+' Reverse Finger Direction';

reverse.onclick=()=>{

if(!posed||restRig!==posed)return;

reverseCurl[side]=!reverseCurl[side];

applyFingerCurl(side,fingerValues[side]);

syncJoint();

anatomyStatus.textContent=
label+' finger direction reversed';

};

anatomyPanel.appendChild(reverse);

addControl(label+' Thumb Curl',0,65,v=>{

const target=forward();

if(reverseCurl[side])target.negate();

for(let j=1;j<=3;j++){

const name='finger1-'+j+'.'+side;

const bone=getBone(name);

const dir=direction(
'finger1-'+Math.min(j,2)+'.'+side,
'finger1-'+Math.min(j+1,3)+'.'+side
);

if(!bone||!dir)continue;

const axis=new THREE.Vector3()
.crossVectors(dir,target);

if(axis.lengthSq()<0.000001)continue;

bone.quaternion.setFromAxisAngle(
axis.normalize(),
THREE.MathUtils.degToRad(v*0.65)
);

}

});

}

function resetSliders(){

fingerValues.L=0;
fingerValues.R=0;

for(const item of anatomySliders){

item.slider.value=0;

item.value.textContent='0°';

}

}

const oldBuild=$('buildRig').onclick;

$('buildRig').onclick=async()=>{

await oldBuild();

if(posed){

captureAnatomy();

resetSliders();

anatomyStatus.textContent=
'Anatomical controls ready - Finger Fix';

}

};

const oldReset=$('resetPose').onclick;

$('resetPose').onclick=()=>{

oldReset();

resetSliders();

};

const reset=document.createElement('button');

reset.textContent='Reset Anatomical Pose';

reset.onclick=()=>{

$('resetPose').click();

};

anatomyPanel.appendChild(reset);

`;

const marker='renderer.setAnimationLoop(()=>{';

if(!html.includes(marker))
throw Error('Studio render source missing');

if(!html.includes('</aside>'))
throw Error('Studio panel missing');

html=html.replaceAll(
'V4.5','V4.9 Finger Fix'
);

html=html.replace(
'</aside>',panel+'</aside>'
);

html=html.replace(
marker,
rig+'\\n'+anatomy+'\\n'+marker+
'\\nif(posed&&rigGeneration!==generation)clearRig();'
);

html=html.replaceAll(
String.fromCharCode(92,110),
String.fromCharCode(10)
);

document.open();
document.write(html);
document.close();

}

start().catch(e=>{

const status=document.getElementById('loading');

if(status)
status.textContent='Error: '+e.message;

});
</script>
</body>
</html>
