name: Animation tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'animation_engine/**'
      - 'studio-v5.0.html'
      - '.github/workflows/animation-tests.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q animation_engine
      - run: python animation_engine/reactions.py
      - run: sudo apt-get update && sudo apt-get install -y blender xvfb libgl1-mesa-dri xauth python3-numpy
      - run: xvfb-run -a blender --background --factory-startup --python-expr "import bpy; print(bpy.app.version_string)"
      - name: Verify Blender NumPy dependency
        run: xvfb-run -a blender --background --python-exit-code 1 --python-expr "import numpy; print(numpy.__version__)"
      - name: Render smoke test
        run: |
          mkdir -p test-output
          xvfb-run -a blender --background --factory-startup --python-expr "import bpy; s=bpy.context.scene; s.render.engine='BLENDER_WORKBENCH'; s.render.resolution_x=640; s.render.resolution_y=480; s.render.resolution_percentage=100; s.render.filepath='test-output/smoke.png'; bpy.ops.render.render(write_still=True)"
          test -s test-output/smoke.png
      - name: Generate independent Dhruv prototype
        run: |
          xvfb-run -a blender --background --factory-startup --python-exit-code 1 --python animation_engine/character_prototype.py
          test -s test-output/dhruv-prototype.png
          test -s test-output/dhruv-prototype.blend
          test -s test-output/dhruv-prototype.glb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-render-test
          path: test-output/
