
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Kumar Studio V4.10.1</title>
</head>

<body style="background:#101827;color:white;font:16px Arial">

<p id="loading">Loading corrected studio...</p>

<script>
async function start(){

const response=await fetch(
'./studio-v4.10.html',
{cache:'no-cache'}
);

if(!response.ok)
throw Error('Source unavailable');

let source=await response.text();

const oldCode=
'upgrade+"'+
String.fromCharCode(92,92)+
'n"+marker';

if(!source.includes(oldCode))
throw Error('Patch not found');

source=source.replace(
oldCode,
'upgrade+String.fromCharCode(10)+marker'
);

document.open();
document.write(source);
document.close();

}

start().catch(e=>{
document.getElementById('loading')
.textContent='Error: '+e.message;
});
</script>

</body>
</html>
