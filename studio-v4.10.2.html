
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Kumar Studio V4.10.2</title>
</head>

<body style="background:#101827;color:white;font:16px Arial">

<p id="loading">
Loading Natural Fist and Combat Studio...
</p>

<script>
async function start(){

const response=await fetch(
'./studio-v4.10.html',
{cache:'no-cache'}
);

if(!response.ok)
throw Error('V4.10 source unavailable');

let source=await response.text();

const oldCode=
'upgrade+"'+
String.fromCharCode(92,92)+
'n"+marker';

if(!source.includes(oldCode))
throw Error('Initialization patch missing');

source=source.replace(
oldCode,
'upgrade+String.fromCharCode(10)+marker'
);

const correction=`

function naturalFist4102(side,amount){

if(!posed||restRig!==posed)return;

const frame=handFrame(side);

if(!frame)return;

const state=handState[side];

const strength=THREE.MathUtils.clamp(
amount/100,0,1
);

const wrist=getBone('wrist.'+side);

if(!wrist)return;

state.mode='fist';

state.curl=[
strength*85,
amount,
amount,
amount,
amount
];

state.opposition=amount;

state.spread=0;

for(let f=1;f<=5;f++){

for(let j=1;j<=3;j++){

const bone=getBone(
fingerName(side,f,j)
);

if(bone)bone.quaternion.identity();

}

}

posed.updateMatrixWorld(true);

const wristQ=wrist.getWorldQuaternion(
new THREE.Quaternion()
);

const palmNormal=frame.normal.clone()
.applyQuaternion(wristQ)
.normalize();

const palmAcross=frame.across.clone()
.applyQuaternion(wristQ)
.normalize();

const palmAlong=frame.along.clone()
.applyQuaternion(wristQ)
.normalize();

function flex(bone,localDir,target,angle){

if(!bone)return;

posed.updateMatrixWorld(true);

const q=bone.getWorldQuaternion(
new THREE.Quaternion()
);

const d=localDir.clone()
.applyQuaternion(q)
.normalize();

const inward=target.clone()
.addScaledVector(
d,-target.dot(d)
);

if(inward.lengthSq()<0.000001)
return;

inward.normalize();

const axis=new THREE.Vector3()
.crossVectors(d,inward)
.normalize()
.applyQuaternion(q.clone().invert());

bone.quaternion.multiply(
new THREE.Quaternion()
.setFromAxisAngle(
axis,
THREE.MathUtils.degToRad(angle)
)
);

posed.updateMatrixWorld(true);

}

for(let f=2;f<=5;f++){

const angles=[78,95,65];

for(let j=1;j<=3;j++){

const bone=getBone(
fingerName(side,f,j)
);

if(!bone)continue;

const next=getBone(
fingerName(side,f,j+1)
);

const dir=next?
next.position.clone():
bone.position.clone();

flex(
bone,
dir.normalize(),
palmNormal,
angles[j-1]*strength
);

}

}

const t1=getBone(
fingerName(side,1,1)
);

const t2=getBone(
fingerName(side,1,2)
);

const t3=getBone(
fingerName(side,1,3)
);

if(t1&&t2&&t3){

const baseTarget=palmAcross.clone()
.negate()
.addScaledVector(palmAlong,0.75)
.addScaledVector(palmNormal,0.35)
.normalize();

flex(
t1,
t2.position.clone().normalize(),
baseTarget,
48*strength
);

const index=getBone(
fingerName(side,2,2)
);

let middleTarget=palmAcross.clone()
.negate()
.addScaledVector(palmNormal,0.25)
.normalize();

if(index){

middleTarget=index.getWorldPosition(
new THREE.Vector3()
).sub(
t2.getWorldPosition(
new THREE.Vector3()
)
).normalize();

}

flex(
t2,
t3.position.clone().normalize(),
middleTarget,
38*strength
);

const tipTarget=palmNormal.clone()
.negate()
.addScaledVector(
palmAcross,-0.35
)
.normalize();

flex(
t3,
t3.position.clone().normalize(),
tipTarget,
35*strength
);

}

posed.updateMatrixWorld(true);

syncJoint();

}

const previousHand4102=applyHand;

applyHand=function(side){

if(!posed||restRig!==posed)return;

const state=handState[side];

if(state.mode==='fist'){

naturalFist4102(
side,
Math.max(...state.curl)
);

return;

}

previousHand4102(side);

};

const previousPunch4102=punch410;

punch410=function(progress){

previousPunch4102(progress);

if(!posed||!snapshot410)return;

const side=side410.value;

const strength=Math.min(
100,
Math.sin(Math.PI*progress)*180
);

naturalFist4102(
side,
Math.max(0,strength)
);

};

document.title='Kumar Studio V4.10.2';

const heading4102=document.querySelector('h1');

if(heading4102)
heading4102.textContent=
'KUMAR STUDIO V4.10.2';

`;

const marker=
'const marker="renderer.setAnimationLoop(()=>{";';

if(!source.includes(marker))
throw Error('Animation marker missing');

const insertion=
'const correction4102='+
JSON.stringify(correction)+';';

source=source.replace(
marker,
insertion+
String.fromCharCode(10)+
marker
);

const patchPoint=
'upgrade+String.fromCharCode(10)+marker';

source=source.replace(
patchPoint,
'upgrade+String.fromCharCode(10)+'+
'correction4102+'+
'String.fromCharCode(10)+marker'
);

document.open();
document.write(source);
document.close();

}

start().catch(e=>{

const status=document.getElementById(
'loading'
);

if(status)
status.textContent='Error: '+e.message;

});

</script>
</body>
</html>
